[project]
name = "cascast"
version = "1.0.0"
description = "Real-time cascading-failure forecasting for power grids with graph neural networks"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "onnxruntime>=1.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "anthropic>=0.75",
    "orjson>=3.10",
]

[project.scripts]
cascast-simulator = "cascast.services.simulator:main"
cascast-risk-engine = "cascast.services.risk_engine:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]
train = [
    "torch>=2.7",
    "pandapower>=2.14",
    "networkx>=3.4",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "onnx>=1.17",
    "tqdm>=4.67",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascast"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
